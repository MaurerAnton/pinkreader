name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM UTC daily
  workflow_dispatch:

# The tag push at the end needs write access. Without this, scheduled
# runs use a read-only token and `git push -f origin nightly` fails
# with 403 (this is what broke every nightly Jul 21-25).
permissions:
  contents: write

jobs:
  nightly:
    name: "Nightly Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build date
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "BUILD_DATETIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" \
            "platform-tools" \
            2>&1 | tail -5

      - name: Build nightly APK
        run: gradle assembleDebug --no-daemon

      - name: Upload nightly APK
        uses: actions/upload-artifact@v4
        with:
          name: PinkReader-nightly-${{ env.BUILD_DATE }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Create nightly tag
        run: |
          git tag -f nightly
          git push -f origin nightly
